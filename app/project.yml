# XcodeGen 由此產生 KidsAI.xcodeproj（不進 git）。專案設定只改這個檔。
name: KidsAI

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  KidsAI:
    type: application
    platform: iOS
    sources:
      - KidsAI
      # 課程內容（唯讀）：以資料夾打包成 App 內的 units/，內容只改 content/，不在這裡複製
      - path: ../content/units
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmosword.kidsai
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"  # 首版只做 iPhone（docs/first-release-scope.md）
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        # XcodeGen 給 iOS app target 的預設值是 ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon。
        # 加入 KidsAI/Assets.xcassets 之後 actool 才真的跑，找不到 AppIcon 就讓 Debug／Release build 失敗。
        # App 圖示排在 D6／P8（docs/art/next-stage-plan.md），還沒有已核准的圖；先宣告「這個 target 不指定圖示」。
        # D6 放進核准的 AppIcon.appiconset 時，把這行改回 AppIcon（docs/art/p1-art-catalog-status.md）。
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # 正式 App 還沒有麥克風／語音功能，不得加任何 *UsageDescription；另案 L3 再加。
        # 只用系統提供的加密（docs/release/app-store-submission.md），上傳時不再問出口合規
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"  # 鎖直向
    scheme:
      testTargets:
        - KidsAITests
        # 驗證 skill（verify-kidsai）用的真實點擊流程；只在測試時編譯，不進 App
        - KidsAIUITests

  KidsAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KidsAITests
    dependencies:
      - target: KidsAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmosword.kidsai.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # 真實點擊的流程測試（XCUITest）：給 .claude/skills/verify-kidsai 錄證據用
  KidsAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KidsAIUITests
    dependencies:
      - target: KidsAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmosword.kidsai.uitests
        TEST_TARGET_NAME: KidsAI
        GENERATE_INFOPLIST_FILE: "YES"

  # 語音辨識 spike：只裝在大人的測試 iPhone 上，不上架、不併入 KidsAI（見 docs/spikes/）。
  ASRSpike:
    type: application
    platform: iOS
    sources:
      - ASRSpike
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmosword.kidsai.asrspike
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "ASR 測試"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "本 App 在孩子「跟著說」時使用麥克風，聲音只在這支 iPhone 上即時處理，不會錄音或儲存。不允許也沒關係，孩子可以改按按鈕、跟著旁白一起說來完成。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "本 App 只在這支 iPhone 上處理，判斷孩子有沒有說出指定的詞，判斷完立即丟棄，不會保存文字或聲音。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme: {}
